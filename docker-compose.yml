services:
  gnss2cloud:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: gnss2cloud:latest
    container_name: gnss2cloud-${STATION_NAME:-station01}

    devices:
      - /dev/gnss0:/dev/gnss0
      - ${NMEA_DEVICE_PATH:-/dev/null}:${NMEA_DEVICE_PATH:-/dev/null}

    # Grants access to the host's dialout group so the container's 'gnss'
    # user can open the serial device. Find your host's GID with:
    #   getent group dialout
    group_add:
      - "${DIALOUT_GID}"

    environment:
      - GNSS_DEVICE=gnss0
      - GNSS_BAUD=${GNSS_BAUD:-460800}
      - GNSS_FORMAT=${GNSS_FORMAT:-}
      - STATION_NAME=${STATION_NAME:-station01}
      - REMOTE_STORAGE_1=${REMOTE_STORAGE_1}
      - REMOTE_STORAGE_2=${REMOTE_STORAGE_2}
      # Optional filtered-NMEA fan-out (GSV/VTG/GSA only) for the
      # web dashboard's live position/CN0 panel. Default is "none" —
      # no output, no behavior change. See docs/receiver-setup.md.
      - NMEA_SOURCE_MODE=${NMEA_SOURCE_MODE:-none}
      - NMEA_INTERNAL_PORT=${NMEA_INTERNAL_PORT:-5015}
      - NMEA_DEVICE_PATH=${NMEA_DEVICE_PATH:-}
      - NMEA_BAUD=${NMEA_BAUD:-9600}

    # Internal-only: reachable by other containers on this compose
    # network (e.g. the optional web dashboard's NMEA bridge), never
    # published to the host. No-op unless NMEA_SOURCE_MODE is set.
    expose:
      - "${NMEA_INTERNAL_PORT:-5015}"

    volumes:
      - ${DATA_DIR:-./data}/raw:/data/raw
      - ${DATA_DIR:-./data}/rinex:/data/rinex
      - ${DATA_DIR:-./data}/logs:/data/logs
      - ${RCLONE_CONFIG:-./rclone.conf}:/home/gnss/.config/rclone/rclone.conf:ro

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  gnss2cloud-web:
    build:
      context: ./web
    image: gnss2cloud-web:latest
    container_name: gnss2cloud-web-${STATION_NAME:-station01}

    # Opt-in only: docker compose --profile web up
    profiles:
      - web

    environment:
      - NMEA_BRIDGE_HOST=gnss2cloud
      - NMEA_INTERNAL_PORT=${NMEA_INTERNAL_PORT:-5015}
      - WEB_AUTH_ENABLED=${WEB_AUTH_ENABLED:-false}
      - WEB_LOG_TAIL_LINES=${WEB_LOG_TAIL_LINES:-50}
      - WEB_MOVEMENT_WINDOW_S=${WEB_MOVEMENT_WINDOW_S:-60}
      - WEB_SECURITY_LOG_PATH=/data/web_logs/security_events.log

    volumes:
      # Read-only, logs only — never the full ./data tree (raw/rinex
      # stay inaccessible even under compromise, per earlier design).
      - ${DATA_DIR:-./data}/logs:/data/logs:ro
      # Separate, writable location for this container's OWN sink
      # (security-event log, Step 7) — never shared with the main
      # container's volumes.
      - ${WEB_DATA_DIR:-./web_data}:/data/web_logs

    # No `ports:` published by default — reachable only from other
    # containers on this compose network. Put a reverse proxy in
    # front (TLS + basic auth) before any remote-network access; see
    # docs. Uncomment below ONLY for local testing on a trusted LAN:
    # ports:
    #   - "8000:8000"

    depends_on:
      - gnss2cloud

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
